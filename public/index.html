<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <h1>Library Management System</h1>
        </div>
        <nav class="nav">
          <a href="#dashboard">Dashboard</a>
          <a href="#books">Books</a>
          <a href="#add-book">Add Book</a>
        </nav>
      </header>

      <main>
        <section id="dashboard" class="stats">
          <div class="card">
            <h3>Total Books</h3>
            <p id="totalBooks">0</p>
          </div>
          <div class="card available-card">
            <h3>Available Books</h3>
            <p id="availableBooks">0</p>
          </div>
          <div class="card issued-card">
            <h3>Issued Books</h3>
            <p id="issuedBooks">0</p>
          </div>
        </section>

        <section class="panel add-book-panel" id="add-book">
          <h2 id="formTitle">Add Book</h2>
          <form id="bookForm">
            <input type="hidden" id="bookId" />

            <div class="form-grid">
              <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter book title" required />
              </div>

              <div class="field">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" placeholder="Enter author name" required />
              </div>

              <div class="field">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="Enter category" required />
              </div>

              <div class="field">
                <label for="year">Year</label>
                <input type="number" id="year" name="year" placeholder="2024" min="1900" max="2100" required />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="submitButton">Add Book</button>
              <button type="button" id="cancelEdit" class="secondary hidden">Cancel</button>
            </div>
          </form>
        </section>

        <section class="panel" id="books">
          <div class="table-top">
            <h2>Book List</h2>
            <input type="text" id="searchInput" placeholder="Search by title, author or category" />
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Category</th>
                  <th>Year</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="bookTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
